apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: npm-and-test
spec:
  workspaces:
    - name: source
  steps:
    - name: install-dependencies
      image: node:18-alpine
      workingDir: $(workspaces.source.path)
      script: |
        npm install
    - name: run-jasmine-tests
      image: node:18-alpine
      workingDir: $(workspaces.source.path)
      script: |
        npx jasmine
